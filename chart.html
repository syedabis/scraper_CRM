<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Overview - Premium Analytics Dashboard</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0d13;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-card {
            background: #131520;
            border: 1px solid #202436;
            border-radius: 16px;
            width: 100%;
            max-width: 850px;
            padding: 32px 28px 24px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .title-section h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .trend-badge {
            color: #10b981;
            font-size: 14px;
            font-weight: 600;
        }

        .trend-badge span {
            color: #8a8f9f;
            font-weight: 400;
            margin-left: 4px;
        }

        .date-range {
            color: #8a8f9f;
            font-size: 14px;
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 380px;
            margin-bottom: 16px;
        }

        /* Custom Legend to match UI exactly */
        .custom-legend {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            padding-left: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c5c7d0;
            font-size: 14px;
            font-weight: 500;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-total {
            background-color: #b3b2fc;
        }

        .dot-converted {
            background-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="card-header">
            <div class="title-section">
                <h2>Leads Overview</h2>
                <div class="trend-badge">+25.1% <span>vs previous period</span></div>
            </div>
            <div class="date-range">Jul 4 – Jul 18, 2026 (real data)</div>
        </div>

        <div class="chart-container">
            <canvas id="leadsChart"></canvas>
        </div>

        <div class="custom-legend">
            <div class="legend-item">
                <div class="legend-dot dot-total"></div>
                Total Leads
            </div>
            <div class="legend-item">
                <div class="legend-dot dot-converted"></div>
                Converted
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('leadsChart').getContext('2d');

        // Linear gradients for area fills under curves
        const totalLeadsGradient = ctx.createLinearGradient(0, 0, 0, 350);
        totalLeadsGradient.addColorStop(0, 'rgba(179, 178, 252, 0.25)');
        totalLeadsGradient.addColorStop(1, 'rgba(179, 178, 252, 0.00)');

        const convertedGradient = ctx.createLinearGradient(0, 0, 0, 350);
        convertedGradient.addColorStop(0, 'rgba(16, 185, 129, 0.15)');
        convertedGradient.addColorStop(1, 'rgba(16, 185, 129, 0.00)');

        // REAL dashboard data (Jul 4–18): note the 0 → 83 jump at 7/12
        const labels = ['7/4', '7/5', '7/6', '7/7', '7/8', '7/9', '7/10', '7/11', '7/12', '7/13', '7/14', '7/15', '7/16', '7/17', '7/18'];
        const totalLeadsData = [45, 0, 84, 50, 58, 40, 32, 49, 0, 83, 64, 48, 0, 0, 0];
        const convertedData = [5, 0, 13, 7, 10, 9, 7, 7, 0, 5, 8, 7, 0, 0, 0];

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Total Leads',
                        data: totalLeadsData,
                        borderColor: '#b3b2fc',
                        borderWidth: 2.5,
                        backgroundColor: totalLeadsGradient,
                        fill: true,
                        tension: 0.4, // Smooth bezier curves!
                        spanGaps: true, // Forces line to remain continuous through 0 or nulls without breaking
                        pointBackgroundColor: '#b3b2fc',
                        pointHoverBackgroundColor: '#ffffff',
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointHitRadius: 10
                    },
                    {
                        label: 'Converted',
                        data: convertedData,
                        borderColor: '#10b981',
                        borderWidth: 2.5,
                        backgroundColor: convertedGradient,
                        fill: true,
                        tension: 0.4, // Smooth bezier curves!
                        spanGaps: true, // Forces line to remain continuous
                        pointBackgroundColor: '#10b981',
                        pointHoverBackgroundColor: '#ffffff',
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointHitRadius: 10
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false // Using clean custom HTML legend instead
                    },
                    tooltip: {
                        backgroundColor: '#1c1f30',
                        titleColor: '#8a8f9f',
                        bodyColor: '#ffffff',
                        borderColor: '#2d324d',
                        borderWidth: 1,
                        padding: 12,
                        boxPadding: 6,
                        usePointStyle: true
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#8a8f9f',
                            font: {
                                size: 12,
                                weight: '500'
                            },
                            padding: 10
                        },
                        border: {
                            display: false
                        }
                    },
                    y: {
                        min: 0,
                        max: 85, // Matches the real data's peak (84)
                        ticks: {
                            stepSize: 20,
                            color: '#8a8f9f',
                            font: {
                                size: 12,
                                weight: '500'
                            },
                            padding: 12
                        },
                        grid: {
                            color: 'rgba(40, 44, 68, 0.4)',
                            drawTicks: false
                        },
                        border: {
                            dash: [4, 4],
                            display: false
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
