<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Payment Receipt Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .tooltip {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
            animation: fadeIn 0.5s, fadeOut 0.5s 2.5s;
        }
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        @keyframes fadeOut {
            from {opacity: 1;}
            to {opacity: 0;}
        }
        .submit-button {
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-button:hover {
            background-color: #1d4ed8;
        }
        .test-button {
            background-color: #059669;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .test-button:hover {
            background-color: #047857;
        }
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-top: 4px;
        }
        .form-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Course Payment Receipt Generator</h1>
            
            <form id="receiptForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Student Name</label>
                    <input type="text" id="name" name="name" required class="form-input">
                </div>
                
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700">Course Fees</label>
                    <input type="number" id="amount" name="amount" step="0.01" required class="form-input">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" name="email" required class="form-input">
                </div>
                
                <button type="submit" class="submit-button">
                    Generate Receipt
                </button>
            </form>
        </div>
    </div>

    <div id="tooltip" class="tooltip">Receipt generated successfully!</div>

    <script>
        document.getElementById('receiptForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent default form submission

            const formData = new FormData(this);

            try {
                const response = await fetch('/generate-receipt', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const tooltip = document.getElementById('tooltip');
                    tooltip.style.display = 'block';

                    // Reset form
                    this.reset();

                    // Hide tooltip after 3 seconds and refresh the window
                    setTimeout(() => {
                        tooltip.style.display = 'none';
                        window.location.reload(); // Refresh the window
                    }, 3000);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
